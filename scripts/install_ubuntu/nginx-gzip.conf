# Prismateams: compress HTML/CSS/JS/JSON at the reverse proxy (P05).
# Installed to /etc/nginx/conf.d/teamportal-gzip.conf (http context).
# text/html is always gzipped when gzip is on. Do not gzip images, woff2, video, SSE.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_http_version 1.1;
gzip_disable "msie6";
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;
