# Prismateams – Docker Compose
#
# Kern:  docker compose up -d
# Plus:  docker compose --profile onlyoffice --profile excalidraw --profile mirotalk --profile hycanvas up -d
#
# Voraussetzung: .env im Projektroot (siehe docs/env.docker.example)

name: prismateams

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-teamportal}
      MYSQL_USER: ${MYSQL_USER:-teamportal}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-teamportal_db_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-teamportal_root_pass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - portal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - portal

  app:
    # Standard: Image von Docker Hub. Lokal neu bauen: docker compose build app
    image: ${APP_IMAGE:-iamcriptic/prismateams:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      DATABASE_URI: mysql+pymysql://${MYSQL_USER:-teamportal}:${MYSQL_PASSWORD:-teamportal_db_pass}@db:3306/${MYSQL_DATABASE:-teamportal}
      REDIS_ENABLED: "True"
      REDIS_URL: redis://redis:6379/0
      UPLOAD_FOLDER: uploads
      # Server→Sidecar (Compose-DNS); Browser nutzt Proxy-Pfade aus .env
      MIROTALK_API_URL: ${MIROTALK_API_URL:-http://mirotalk:3010}
      HYCANVAS_API_URL: ${HYCANVAS_API_URL:-http://hycanvas:8005}
      HYCANVAS_JWT_SECRET: ${HYCANVAS_JWT_SECRET:-changeme-hycanvas-jwt}
      HYCANVAS_DATABASE_URL: ${HYCANVAS_DATABASE_URL:-postgresql://${HYCANVAS_DB_USER:-hycanvas}:${HYCANVAS_DB_PASSWORD:-changeme-hycanvas-db}@hycanvas-db:5432/${HYCANVAS_DB_NAME:-hycanvas}}
    volumes:
      - app_uploads:/app/uploads
      - app_instance:/app/instance
    ports:
      - "${APP_HOST_BIND:-127.0.0.1}:${APP_HOST_PORT:-5000}:5000"
    networks:
      - portal

  # Containerisierter Reverse-Proxy (Betriebssystemunabhängig: Windows, macOS, Linux)
  proxy:
    profiles: ["proxy"]
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${PORTAL_HOST_BIND:-0.0.0.0}:${PORTAL_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - portal

  # Euro-Office Document Server (optional)
  eurooffice:
    profiles: ["onlyoffice"]
    image: ${ONLYOFFICE_IMAGE:-ghcr.io/euro-office/documentserver:latest}
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_SECRET_KEY:-changeme-onlyoffice-jwt}
      JWT_HEADER: Authorization
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    volumes:
      - eurooffice_data:/var/lib/euro-office/documentserver
      - eurooffice_logs:/var/log/euro-office/documentserver
      - eurooffice_fonts:/usr/share/fonts/truetype/custom
    ports:
      - "${EUROOFFICE_HOST_BIND:-127.0.0.1}:${EUROOFFICE_HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1/healthcheck | grep -qi true"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - portal

  # Excalidraw Room – Live-Kollaboration (optional)
  excalidraw-room:
    profiles: ["excalidraw"]
    image: ${EXCALIDRAW_ROOM_IMAGE:-excalidraw/excalidraw-room:latest}
    restart: unless-stopped
    environment:
      PORT: "80"
    ports:
      - "${EXCALIDRAW_HOST_BIND:-127.0.0.1}:${EXCALIDRAW_HOST_PORT:-8082}:80"
    networks:
      - portal

  # MiroTalk SFU – Meetings (optional; WebRTC braucht öffentliche IP + UDP-Ports)
  mirotalk:
    profiles: ["mirotalk"]
    image: ${MIROTALK_IMAGE:-mirotalk/sfu:latest}
    restart: unless-stopped
    user: "1000:1000"
    environment:
      NODE_ENV: production
      SFU_ANNOUNCED_IP: ${SFU_ANNOUNCED_IP:-}
      SFU_LISTEN_IP: "0.0.0.0"
      SFU_MIN_PORT: ${MIROTALK_UDP_MIN:-40000}
      SFU_MAX_PORT: ${MIROTALK_UDP_MAX:-40100}
      SERVER_HOST_URL: ${MIROTALK_URL:-http://localhost:3010}
      SERVER_LISTEN_IP: "0.0.0.0"
      SERVER_LISTEN_PORT: "3010"
      TRUST_PROXY: "true"
      CORS_ORIGIN: ${MIROTALK_CORS_ORIGIN:-*}
      ALLOWED_EMBED_ORIGINS: ${MIROTALK_EMBED_ORIGINS:-*}
      HOST_PROTECTED: "true"
      HOST_USER_AUTH: "false"
      HOST_USERS: "${MIROTALK_HOST_USER:-portal}:${MIROTALK_HOST_PASSWORD:-changeme-mirotalk-pass}:Portal:*"
      API_KEY_SECRET: ${MIROTALK_API_KEY:-changeme-mirotalk-api}
      JWT_SECRET: ${MIROTALK_JWT_SECRET:-change-me-mirotalk-jwt}
      JWT_EXPIRATION: 8h
      RECORDING_ENABLED: "false"
    ports:
      - "${MIROTALK_HOST_PORT:-3010}:3010"
      - "${MIROTALK_UDP_MIN:-40000}-${MIROTALK_UDP_MAX:-40100}:${MIROTALK_UDP_MIN:-40000}-${MIROTALK_UDP_MAX:-40100}/udp"
      - "${MIROTALK_UDP_MIN:-40000}-${MIROTALK_UDP_MAX:-40100}:${MIROTALK_UDP_MIN:-40000}-${MIROTALK_UDP_MAX:-40100}/tcp"
    networks:
      - portal

  # HyCanvas – Visueller Canvas & Design-Workspace (optional)
  hycanvas-db:
    profiles: ["hycanvas"]
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 128m
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=100"]
    environment:
      POSTGRES_USER: ${HYCANVAS_DB_USER:-hycanvas}
      POSTGRES_PASSWORD: ${HYCANVAS_DB_PASSWORD:-changeme-hycanvas-db}
      POSTGRES_DB: ${HYCANVAS_DB_NAME:-hycanvas}
    volumes:
      - hycanvas_pgdata:/var/lib/postgresql/data
    ports:
      - "${HYCANVAS_DB_HOST_BIND:-127.0.0.1}:${HYCANVAS_DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HYCANVAS_DB_USER:-hycanvas} -d ${HYCANVAS_DB_NAME:-hycanvas}"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: ${HYCANVAS_DB_MEM_LIMIT:-512m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - portal

  hycanvas:
    profiles: ["hycanvas"]
    image: ${HYCANVAS_IMAGE:-hycanvas/hycanvas:latest}
    restart: unless-stopped
    depends_on:
      hycanvas-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${HYCANVAS_NODE_OPTIONS:---max-old-space-size=768}
      DATABASE_URL: postgresql://${HYCANVAS_DB_USER:-hycanvas}:${HYCANVAS_DB_PASSWORD:-changeme-hycanvas-db}@hycanvas-db:5432/${HYCANVAS_DB_NAME:-hycanvas}?schema=public
      JWT_SECRET: ${HYCANVAS_JWT_SECRET:-changeme-hycanvas-jwt}
      COOKIE_SECURE: ${HYCANVAS_COOKIE_SECURE:-false}
      ASSET_QUOTA_BYTES: ${HYCANVAS_ASSET_QUOTA_BYTES:-1099511627776}
      SMTP_HOST: ${HYCANVAS_SMTP_HOST:-${MAIL_SERVER:-}}
      SMTP_PORT: ${HYCANVAS_SMTP_PORT:-${MAIL_PORT:-587}}
      SMTP_USER: ${HYCANVAS_SMTP_USER:-${MAIL_USERNAME:-}}
      SMTP_PASS: ${HYCANVAS_SMTP_PASS:-${MAIL_PASSWORD:-}}
      SMTP_FROM: ${HYCANVAS_SMTP_FROM:-${MAIL_DEFAULT_SENDER:-}}
      SMTP_SECURE: ${HYCANVAS_SMTP_SECURE:-false}
    volumes:
      - hycanvas_storage:/app/.data/storage
    ports:
      - "${HYCANVAS_HOST_BIND:-127.0.0.1}:${HYCANVAS_HOST_PORT:-8005}:8005"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8005/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: ${HYCANVAS_MEM_LIMIT:-1g}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - portal

networks:
  portal:
    driver: bridge

volumes:
  db_data:
  redis_data:
  app_uploads:
  app_instance:
  eurooffice_data:
  eurooffice_logs:
  eurooffice_fonts:
  hycanvas_pgdata:
  hycanvas_storage:
