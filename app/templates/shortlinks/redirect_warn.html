<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>{{ _('shortlinks.redirect_warn.title') }}</title>
{% include 'partials/vendor_bootstrap_css.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/portal-msg.css') }}">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .warn-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
        }
        .warn-card {
            width: 100%;
            max-width: 520px;
            border: 0;
            border-radius: 1rem;
            box-shadow: 0 18px 45px rgba(20, 24, 50, 0.35);
        }
        .target-url {
            word-break: break-all;
            font-size: 0.92rem;
            background: #f4f6fb;
            border-radius: 0.75rem;
            padding: 0.85rem 1rem;
        }
        .btn-primary, .btn-outline-secondary {
            border-radius: 0.75rem;
            padding: 0.78rem 1rem;
            font-weight: 600;
        }
        .btn-primary {
            border: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body>
<div class="warn-wrap">
    <div class="card warn-card">
        <div class="card-body p-4 p-md-5">
            <h1 class="h4 fw-bold mb-3">{{ _('shortlinks.redirect_warn.title') }}</h1>
            <div class="alert portal-msg portal-msg--warning alert-permanent mb-3" role="note">
                <div class="portal-msg__body">
                    <div class="portal-msg__icon" aria-hidden="true">
                        <i class="bi bi-box-arrow-up-right"></i>
                    </div>
                    <div class="portal-msg__content">
                        <p class="portal-msg__text mb-0">{{ _('shortlinks.redirect_warn.message') }}</p>
                    </div>
                </div>
            </div>
            <p class="text-muted small mb-2">{{ _('shortlinks.redirect_warn.destination') }}</p>
            <div class="target-url mb-4">{{ target_url }}</div>
            <form method="POST" class="d-grid gap-2">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                {% if shortlink.password_hash %}
                <input type="hidden" name="password" value="{{ request.form.get('password', '') }}">
                {% endif %}
                <button type="submit" name="confirm_external" value="1" class="btn btn-primary mod-pill-btn">
                    {{ _('shortlinks.redirect_warn.continue') }}
                </button>
                <a href="{{ url_for('auth.login') }}" class="btn mod-pill-btn mod-pill-btn--outline-muted">
                    {{ _('shortlinks.redirect_warn.cancel') }}
                </a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
