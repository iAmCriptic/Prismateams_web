<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Passwort erforderlich</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/portal-msg.css') }}">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .pw-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
        }
        .pw-card {
            width: 100%;
            max-width: 440px;
            border: 0;
            border-radius: 1rem;
            box-shadow: 0 18px 45px rgba(20, 24, 50, 0.35);
            backdrop-filter: blur(1px);
        }
        .pw-title {
            font-weight: 700;
            letter-spacing: 0.2px;
        }
        .form-control {
            border-radius: 0.75rem;
            padding: 0.78rem 0.95rem;
            border: 1px solid #cfd7ea;
        }
        .form-control:focus {
            border-color: #7a84ff;
            box-shadow: 0 0 0 0.22rem rgba(122, 132, 255, 0.2);
        }
        .btn-primary {
            border-radius: 0.75rem;
            padding: 0.78rem 1rem;
            font-weight: 600;
            border: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .btn-primary:hover {
            filter: brightness(1.03);
        }
    </style>
</head>
<body>
<div class="pw-wrap">
    <div class="card pw-card">
        <div class="card-body p-4 p-md-5">
            <h1 class="h4 pw-title mb-3">Passwort erforderlich</h1>
            <div class="alert portal-msg portal-msg--info alert-permanent mb-3" role="note">
                <div class="portal-msg__body">
                    <div class="portal-msg__icon" aria-hidden="true">
                        <i class="bi bi-lock-fill"></i>
                    </div>
                    <div class="portal-msg__content">
                        <p class="portal-msg__text">Dieser Link ist passwortgeschützt.</p>
                    </div>
                </div>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                    {% set cat = 'danger' if category == 'error' else category %}
                    <div class="alert portal-msg portal-msg--{{ cat }} alert-permanent mb-3" role="alert">
                        <div class="portal-msg__body">
                            <div class="portal-msg__icon" aria-hidden="true">
                                <i class="bi bi-{% if cat == 'success' %}check-circle-fill{% elif cat == 'warning' %}exclamation-triangle-fill{% elif cat == 'danger' %}exclamation-circle-fill{% else %}info-circle-fill{% endif %}"></i>
                            </div>
                            <div class="portal-msg__content">
                                <p class="portal-msg__text">{{ message }}</p>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="mb-3">
                    <label for="password" class="form-label">Passwort</label>
                    <input type="password" class="form-control" id="password" name="password" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary w-100">Weiter</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
