<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kurzlink nicht verfügbar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/portal-msg.css') }}">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .unavailable-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
        }
        .unavailable-card {
            width: 100%;
            max-width: 520px;
            border: 0;
            border-radius: 1rem;
            box-shadow: 0 18px 45px rgba(20, 24, 50, 0.35);
        }
        .unavailable-title {
            font-weight: 700;
            letter-spacing: 0.2px;
        }
    </style>
</head>
<body>
<div class="unavailable-wrap">
    <div class="card unavailable-card">
        <div class="card-body p-4 p-md-5 text-center">
            <h1 class="h4 unavailable-title mb-3">Kurzlink nicht verfügbar</h1>
            <div class="alert portal-msg portal-msg--danger alert-permanent mb-3 text-start" role="alert">
                <div class="portal-msg__body">
                    <div class="portal-msg__icon" aria-hidden="true">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                    </div>
                    <div class="portal-msg__content">
                        <p class="portal-msg__text">Der Link ist ungültig, deaktiviert oder abgelaufen.</p>
                    </div>
                </div>
            </div>
            <p class="text-muted mb-0">Bitte prüfe die Adresse oder frage den Link-Ersteller nach einem neuen Kurzlink.</p>
        </div>
    </div>
</div>
</body>
</html>
