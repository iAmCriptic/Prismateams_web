{% extends "base.html" %}

{% block title %}{{ _('canvas.index.page_title') }}{% endblock %}

{% block extra_css %}
<style>
body:has(.canvas-shell) {
    overflow: hidden;
}
.canvas-shell {
    position: fixed;
    top: var(--top-navbar-height, 64px);
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 1;
    overflow: hidden;
    background: var(--bs-body-bg);
}
@media (max-width: 767.98px) {
    .canvas-shell {
        bottom: var(--portal-mobile-nav-clearance, 0px);
    }
}
.canvas-embed-frame {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: var(--bs-body-bg);
}
</style>
{% endblock %}

{% block content %}
<div class="canvas-shell">
    <iframe name="hycanvasFrame"
            src="{{ hycanvas_url }}"
            class="canvas-embed-frame"
            title="{{ _('canvas.index.heading') }}"
            allow="clipboard-read; clipboard-write; fullscreen"></iframe>
</div>
{% endblock %}
