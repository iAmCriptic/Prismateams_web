<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ survey.title }}</title>
    {% include 'partials/vendor_bootstrap_css.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/module-ui.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mod-buttons.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/surveys.css') }}">
    {% include 'auth/_auth_bg.html' %}
</head>
<body class="survey-public-body">
<div class="survey-public-shell">
    <div class="survey-public-panel text-center" style="max-width: 480px;">
        <i class="bi bi-check-circle-fill text-success display-4 mb-3"></i>
        <h1 class="h4 mb-2">{{ _('surveys.public.done_title') }}</h1>
        <p>{{ settings.confirmation_message or _('surveys.public.done_default') }}</p>
        {% if settings.show_submit_another_link %}
        <a href="{{ url_for('surveys.public_fill', token=token) }}" class="btn btn-outline-primary mod-pill-btn mt-2">{{ _('surveys.public.submit_another') }}</a>
        {% endif %}
    </div>
</div>
</body>
</html>
