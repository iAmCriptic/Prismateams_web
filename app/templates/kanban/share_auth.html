{% extends "base.html" %}
{% block title %}{{ _('kanban.share.password_prompt') }}{% endblock %}
{% block content %}
<div class="kanban-share-auth">
  <form method="POST" class="kanban-share-auth__card">
    <h1 class="h5">{{ board.title }}</h1>
    <p class="text-muted">{{ _('kanban.share.password_prompt') }}</p>
    <input type="password" name="password" class="form-control kanban-pill-input mb-3" required autofocus>
    <button type="submit" class="btn btn-accent kanban-pill-btn w-100">{{ _('kanban.share.submit') }}</button>
  </form>
</div>
{% endblock %}
