{% macro file_converter_sidebar_chrome(id_suffix='', dismiss_offcanvas=false) %}
{% set active_count = active_jobs_count|default(0) %}
<nav class="mod-sidebar-nav nav flex-column gap-1 mb-3" aria-label="{{ _('file_converter.nav.label') }}">
    <button type="button" class="nav-link mod-nav-link fc-nav-link active" data-fc-tab="convert" id="fc-tab-convert{{ id_suffix }}"{% if dismiss_offcanvas %} data-fc-dismiss-offcanvas="1"{% endif %}>
        <i class="bi bi-arrow-left-right me-2"></i>{{ _('file_converter.nav.convert') }}
    </button>
    <button type="button" class="nav-link mod-nav-link fc-nav-link" data-fc-tab="jobs" id="fc-tab-jobs{{ id_suffix }}"{% if dismiss_offcanvas %} data-fc-dismiss-offcanvas="1"{% endif %}>
        <i class="bi bi-list-ul me-2"></i>{{ _('file_converter.nav.jobs') }}
        <span class="badge mod-nav-badge fc-nav-badge ms-auto" data-fc-jobs-badge data-count="{{ active_count }}">{% if active_count %}{{ active_count }}{% endif %}</span>
    </button>
</nav>

<div class="fc-sidebar-actions">
    <button type="button" class="btn fc-clear-link fc-clear-all-btn fc-btn-pill"{% if dismiss_offcanvas %} data-fc-dismiss-offcanvas="1"{% endif %}>
        <i class="bi bi-trash3"></i>
        <span>{{ _('file_converter.nav.clear_all') }}</span>
    </button>
</div>
{% endmacro %}
